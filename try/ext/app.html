<!DOCTYPE html>
<!-- data-syfs-i18n="page": src/i18n.js translates this page's STATIC markup. ⚠️ It
     writes lang/dir on <html>; `#syfa-root` carries its own dir and is still driven by
     src/app.js — the two agree because both read SYFS.i18n.dir() (§6.98/8). -->
<html lang="ar" dir="rtl" data-syfs-i18n="page">
<head>
<meta name="syf-demo" content="1">
<script src="__demo/stub-page.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYF — وضع العمل</title>
  <!-- Shared tool component + window styles (.syf-form/.syf-in/.syf-btn/.syfs-win…).
       They read the --pri/--bg/--line CSS vars, which rail.css defines on .syfs-wrap
       — so the whole app root carries the .syfs-wrap class and the vars cascade to
       every mounted tool AND every floating window (which reuse rail.css's .syfs-win
       chrome verbatim). -->
  <link rel="stylesheet" href="rail.css">
  <!-- The dock + tool-grid flyout it builds are shared with sheet.html (same app.js). -->
  <link rel="stylesheet" href="app-dock.css">
  <style>
    /* App-mode workspace chrome. The floating windows are rail.css .syfs-win. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* --syfs-font comes from src/fontkit.js (`ui_font`); unset → the system stack */
    body { font-family: var(--syfs-font, 'Segoe UI', system-ui, -apple-system, sans-serif); }

    .syfa-app { height: 100vh; display: flex; flex-direction: column; background: var(--soft); color: var(--ink); }

    /* the top header was removed in v0.67.0 — its actions moved into the dock (app.js) */
    .syfa-body { flex: 1; display: flex; min-height: 0; position: relative; }

    /* The floating category dock + its tool-grid flyout live in app-dock.css —
       shared verbatim with sheet.html, which runs the same app.js. */

    /* workspace = the desktop the floating windows live over */
    .syfa-workspace { flex: 1; position: relative; overflow: hidden;
      background:
        radial-gradient(circle, rgba(var(--pri-rgb),.10) 1px, transparent 1px) 0 0 / 22px 22px,
        var(--soft); }
    .syfa-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--mut); text-align: center; padding: 20px; pointer-events: none; }
    .syfa-hint svg { width: 46px; height: 46px; opacity: .5; }
    .syfa-hint b { color: var(--ink); font-size: 15px; }
    .syfa-hint span { font-size: 13px; max-width: 340px; line-height: 1.6; }

    /* ===== workspace tabs (browser-style) — the full-screen page tools
       (Excel / Word / PowerPoint / Mail) embed here instead of opening a new
       browser tab. src/app.js builds the tabs + iframes; #embed hides each page's
       own dock. ===== */
    .syfa-tabbar { flex: 0 0 auto; display: none; align-items: flex-end; gap: 4px; padding: 6px 12px 0; background: var(--pri-d, #325348); }
    .syfa-tabbar:has(.syfa-tab) { display: flex; }              /* appears only once a tab exists */
    .syfa-tabs { display: flex; align-items: flex-end; gap: 4px; flex-wrap: wrap; }
    .syfa-tab { display: inline-flex; align-items: center; gap: 7px; max-width: 230px;
      border: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,.82);
      background: rgba(255,255,255,.12); border-radius: 11px 11px 0 0; padding: 8px 10px 9px;
      transition: background .22s ease, color .22s ease, transform .18s cubic-bezier(.22,.8,.28,1); }
    .syfa-tab:hover { background: rgba(255,255,255,.24); color: #fff; transform: translateY(-1px); }
    .syfa-tab.on { background: var(--bg); color: var(--pri); box-shadow: 0 -3px 10px rgba(0,0,0,.14); }
    .syfa-tab-ic { display: inline-flex; width: 16px; height: 16px; flex: 0 0 auto; }
    .syfa-tab-ic svg { width: 16px; height: 16px; }
    .syfa-tab-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .syfa-tab-x { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
      font-size: 11px; line-height: 1; opacity: .65; transition: background .15s ease, opacity .15s ease; }
    .syfa-tab-x:hover { background: rgba(0,0,0,.16); opacity: 1; }
    .syfa-tab.on .syfa-tab-x:hover { background: rgba(var(--pri-rgb),.18); }

    /* iframe pane host — fills the workspace, shown only while a tab is active */
    .syfa-panes { position: absolute; inset: 0; display: none; z-index: 1; background: var(--bg); }
    body.syfa-tabbing .syfa-panes { display: block; }
    .syfa-pane { position: absolute; inset: 0; display: none; }
    .syfa-pane.on { display: block; }
    .syfa-frame2 { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

    /* the bottom-right resize grip (.syfs-win-grip) is defined in rail.css — shared
       by rail windows and app-mode windows alike. */
  </style>
</head>
<body>
  <!-- The whole app carries .syfs-wrap so rail.css's --pri/--bg/--line vars cascade
       into every mounted tool and every .syfs-win window. .syfa-app adds the layout. -->
  <div id="syfa-root" class="syfs-wrap syfa-app" dir="rtl">
    <!-- No top header: the workspace actions (search / standalone window / arrange /
         close-all) live in the floating dock next to the ⚙ gear — built by app.js
         buildDock(), workspace-only (they need #syfa-workspace). -->
    <!-- browser-style tab strip: full-screen page tools (Excel/Word/PowerPoint/Mail)
         open here as tabs; built by app.js. Hidden (CSS :has) until a tab exists. -->
    <div class="syfa-tabbar"><div class="syfa-tabs" id="syfa-tabs"></div></div>
    <div class="syfa-body">
      <main class="syfa-workspace" id="syfa-workspace">
        <div class="syfa-hint" id="syfa-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M7 6.5h.01M10 6.5h.01"/></svg>
          <b>مساحة العمل فارغة</b>
          <span>اضغط تصنيفاً في الدوك بالأسفل لتظهر أدواته كأيقونات، ثم اختر أداة لتفتح كنافذة. افتح أكثر من أداة معاً، اسحبها وغيّر حجمها. اسحب مقبض الدوك لتنقله.</span>
        </div>
      </main>
      <!-- iframe panes for the open workspace tabs (Excel/Word/PowerPoint/Mail) -->
      <div class="syfa-panes" id="syfa-panes"></div>
    </div>
    <!-- The floating category dock (compact icon bar) + its tool-grid flyout are
         built by app.js inside the .syfs-wrap overlay so they stay above the tool
         windows — see buildDock() / openFlyout(). No scrolling tool list. -->

  </div>

  <!-- EVERY tool file the rail gets, in the rail's order: the manifest bootstrap, then
       background.js LAZY_TOOL_FILES (each *-body.js right after its eager half). Left
       out: only the files that act on a host web page (rail.js — app.js replaces it —
       docdetect, capbar, downloader, techdetect, perfaudit); the list and the reasons
       are in tools/appmode-parity-test.js, which fails when a new tool file or tool id
       reaches the rail and not this page. src/app.js (last) is the window manager +
       dock; it reuses each tool's mount(body) verbatim. -->
  <script src="src/i18n.js"></script>
  <script src="src/btnkit.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/dockfx.js"></script>
  <!-- the shared window-sizing engine; must load before src/app.js attaches it -->
  <script src="src/winsize.js"></script>
  <script src="src/fontkit.js"></script>
  <script src="src/sel2.js"></script>
  <script src="lib/qr.js"></script>
  <script src="src/tools.js"></script>
  <script src="src/tools2.js"></script><script src="src/tools2-body.js"></script>
  <script src="src/registry.js"></script>
  <script src="src/wa-privacy.js"></script>
  <script src="src/azkar-data.js"></script><script src="src/islam2.js"></script><script src="src/islam2-body.js"></script>
  <script src="src/occasions.js"></script><script src="src/occasions-body.js"></script>
  <script src="src/quran.js"></script><script src="src/quran-body.js"></script>
  <script src="src/speed.js"></script>
  <script src="src/imgkit.js"></script>
  <script src="lib/canvas-pdf.js"></script>
  <script src="src/calc.js"></script>
  <script src="src/money.js"></script>
  <script src="src/ai-chat.js"></script>
  <script src="src/shield.js"></script>
  <script src="src/ytplus.js"></script>
  <script src="src/bgrm.js"></script>
  <script src="src/media.js"></script>
  <script src="src/extras.js"></script>
  <script src="src/dev.js"></script>
  <script src="src/dev2.js"></script>
  <script src="src/docview.js"></script>
  <script src="src/vault-launch.js"></script>
  <script src="src/sheet-launch.js"></script>
  <script src="src/word-launch.js"></script>
  <script src="src/slides-launch.js"></script>
  <script src="src/mail-launch.js"></script>
  <script src="src/phones-launch.js"></script>
  <script src="src/status-launch.js"></script>
  <script src="src/frames-launch.js"></script>
  <script src="src/ocr-launch.js"></script>
  <script src="src/calendar.js"></script>
  <script src="src/tools3.js"></script>
  <script src="src/studio.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
