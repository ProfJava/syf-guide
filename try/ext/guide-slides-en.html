<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta name="syf-demo" content="1">
<script src="__demo/stub-page.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYF Tools — User guide (slides)</title>
<!-- The one guide (the gallery guide-en.html was removed in v0.150.0), the same deck published
     as syf-guide (guide-data.js · guide-img/ · guide-meta.js · guide-settings.js). ⛔ No help-lang.js here: the twins would forward to each other forever. -->
<link rel="stylesheet" href="guide-slides.css">
</head>
<body>
<header class="s-top">
  <span class="s-brand"><span class="s-logo" aria-hidden="true">✦</span>SYF Tools · User guide</span>
  <select id="s-jump" aria-label="Jump to a tool"></select>
  <button type="button" id="s-print" class="s-hide-sm">⎙ Print / PDF</button>
  <button type="button" id="s-full" aria-label="Full screen" title="Full screen">⛶</button>
  <button type="button" id="s-theme"></button>
  <a href="guide-slides.html?stay=1" hreflang="ar">العربية</a>
</header>

<main class="s-stage" id="s-stage"></main>

<footer class="s-foot">
  <button type="button" id="s-prev" aria-label="Previous slide">←</button>
  <div class="s-bar"><i id="s-bar-i"></i></div>
  <span id="s-pos" aria-live="polite"></span>
  <span class="s-kb"><kbd>←</kbd><kbd>→</kbd></span>
  <button type="button" id="s-next" aria-label="Next slide">→</button>
</footer>

<script src="guide-data.js"></script>
<script src="guide-meta.js"></script>
<script src="guide-settings.js"></script>
<script src="guide-slides.js"></script>
<script src="src/sel2.js"></script>
</body>
</html>
