<!DOCTYPE html>
<!-- data-syfs-i18n="page": src/i18n.js translates this page's STATIC markup and writes
     lang/dir/--syfs-dir from the stored language (§6.102).

     WHY THIS IS A PAGE (phase-2 review). The rail runs INSIDE the host page, so:
       · a camera or location prompt asked from the rail is asked FOR THAT SITE, which
         keeps «always allow» and can use it later on its own;
       · a Wi-Fi password or a contact card typed into the rail is typed into that page's
         DOM (an open shadow root its scripts can read);
       · the camera <video> sits where the site can capture its frames.
     Here the same tool (src/tools2-body.js qrgen / src/tools3.js qrread) runs on the
     extension's own origin. The worker opens it as a small window on the user's click
     (SYFS_OPEN_TOOLPAGE); src/qrtool.js mounts ONE tool picked from the fragment
     against a fixed list — nothing else from the URL is read. -->
<html lang="ar" dir="rtl" data-syfs-i18n="page">
<head>
<meta name="syf-demo" content="1">
<script src="__demo/stub-page.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYF Tools — QR</title>
  <!-- the tool components (.syf-form/.syf-in/.syf-btn/.syf-qr-*) and their tokens -->
  <link rel="stylesheet" href="rail.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    /* the tokens live on .syfs-wrap (rail.css); dark mode redefines them there */
    html[data-theme="dark"] .syfs-wrap { --ink: #e7ece9; --mut: #a3b1ac; --bg: #1b2320; --line: #34413b; --soft: #24302b; }
    body { background: var(--page-bg, #eef2f0); font-family: var(--syfs-font, 'Segoe UI', system-ui, -apple-system, sans-serif); }
    html[data-theme="dark"] body { --page-bg: #121815; }
    .qt-wrap { min-height: 100vh; color: var(--ink); }
    .qt-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--pri-d); color: #fff; }
    .qt-ic { display: inline-flex; width: 22px; height: 22px; }
    .qt-ic svg { width: 22px; height: 22px; }
    .qt-title { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qt-theme { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.14); color: #fff; border-radius: 8px;
      min-width: 44px; min-height: 36px; padding: 0 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
    .qt-theme:hover { background: rgba(255,255,255,.26); }
    .qt-theme:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .qt-lede { margin: 0; padding: 8px 16px; font-size: 12px; color: var(--mut); background: var(--soft); border-bottom: 1px solid var(--line); }
    /* the tool body: rail.css caps a window body at 70vh; a page has no window to fit */
    .qt-body.syfs-win-body { max-width: 560px; margin: 0 auto; max-height: none; padding: 16px; }
    .qt-err { padding: 24px 16px; text-align: center; color: var(--mut); }
    @media (max-width: 420px) { .qt-body.syfs-win-body { padding: 12px; } }
  </style>
</head>
<body>
  <div class="syfs-wrap qt-wrap" id="qt-root">
    <header class="qt-head">
      <span class="qt-ic" id="qt-ic" aria-hidden="true"></span>
      <h1 class="qt-title" id="qt-title">SYF Tools</h1>
      <button class="qt-theme" id="qt-theme" type="button" aria-pressed="false">الوضع الداكن</button>
    </header>
    <p class="qt-lede">نافذة الإضافة: الكاميرا والموقع وما تكتبه هنا للإضافة وحدها، لا للموقع الذي كنت تتصفّحه.</p>
    <main class="qt-body syfs-win-body" id="qt-body"></main>
  </div>
  <script src="src/i18n.js"></script>
  <script src="src/btnkit.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/fontkit.js"></script>
  <script src="lib/qr.js"></script>
  <script src="lib/canvas-pdf.js"></script>
  <script src="src/tools.js"></script>
  <script src="src/tools2.js"></script><script src="src/tools2-body.js"></script>
  <script src="src/tools3.js"></script>
  <script src="src/qrtool.js"></script>
</body>
</html>
