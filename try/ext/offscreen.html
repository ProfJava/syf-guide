<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="syf-demo" content="1">
<script src="__demo/stub-page.js"></script>
<meta charset="utf-8">
<title>SYF Tools — تشغيل الصوت</title>
<!-- No user ever sees this document. It exists for ONE reason: an <audio> element
     injected by a content script obeys the HOST PAGE's media-src CSP, so a strict
     site (github.com, a bank) would silently block the recitation. An extension
     page obeys the EXTENSION's CSP instead — and, as a side effect that matters
     more than the fix itself, it keeps playing across navigations and tab switches. -->
</head>
<body>
<audio id="syf-audio" preload="none"></audio>
<!-- A SECOND element for short clips (a dhikr, an ayah — v0.127.0). It is separate on
     purpose: a clip must not evict the recitation the user is listening to, and the
     player's whole state machine (position, queue, resume) is keyed to #syf-audio.
     While a clip plays the main element is ducked, then restored. -->
<audio id="syf-clip" preload="none"></audio>
<!-- A THIRD for alerts: the adhan, the pre-adhan chime, a goal dhikr. They used to share
     #syf-clip, so a chime replaced the wird's ayah queue and a dhikr cut the adhan. An
     alert ducks the other two and they come back; alerts rank among themselves. -->
<audio id="syf-alert" preload="none"></audio>
<script src="src/offscreen.js"></script>
</body>
</html>
