<!doctype html>
<!-- «الاستوديو» (v0.166.0) — every image tool and the layered editor, as an EXTENSION page.
     Why a page and not a rail panel: background removal (onnxruntime + WASM), PDF (pdf.js
     module worker) and OCR (Tesseract worker) need workers and wasm, and in a content script
     those would run under the HOST site's CSP — on a strict site they simply would not
     (same reasoning as ocr.html). The rail shows this page in its window (src/studio.js);
     it also opens as a tab of its own.
     ⚠️ No data-syfs-i18n="page": studio/app.js boots the language itself, before it builds
     anything — the frame is built in JS, not written in this markup. -->
<html lang="ar" dir="rtl" data-theme="accent" data-labels="full">
<head>
<meta name="syf-demo" content="1">
<script src="__demo/stub-page.js"></script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستوديو — SYF</title>

<link rel="stylesheet" href="studio/editor.css">
</head>

</html>
